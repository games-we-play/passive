<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被動</title>
    <style>
    html,
    body {
      font:
        16px system-ui,
        sans-serif;
      margin: 0;
      padding: 0;
    }

    article {
      margin: 1rem auto;
      writing-mode: vertical-rl;
    }

    p {
      line-height: 1.25;
      margin-block-start: 0;
      white-space: nowrap;
    }

    button {
      appearance: none;
      background: none;
      border: 0;
      color: LinkText;
      cursor: pointer;
      font: inherit;
      margin: 0;
      padding: 0;
    }

    @media screen and (max-width: 70rem) {
      article {
        column-count: 2;
      }
    }

    @media screen and (max-width: 35rem) {
      article {
        column-count: 3;
      }
    }

    @media screen and (max-width: 25rem) {
      article {
        column-count: 4;
      }
    }
    </style>
  </head>

  <body>
    <article>
      <p>
        她說　<button type="button" data-speech="moo" data-timeout="200">
          /m/
        </button>
        <br>必須很久很久不說話<br>才發得出來<br>這非常低的<button
          type="button"
          data-speech="moo"
          data-timeout="200"
        >
          /m/
        </button>
      </p>
      <p>
        她說　<button type="button" data-speech="moo" data-timeout="200">
          /m/
        </button>
        <br>然後不動<br>不想動
      </p>
      <p>
        那音節搖動了一絲漣漪<br>在養著青苔<br>綠灰的湖<br>她說　<button
          type="button"
          data-speech="moo"
          data-timeout="200"
        >
          /m/
        </button>
        <br>然後她說　<button type="button" data-speech="no" data-timeout="200">
          /n/
        </button>
        <br>就是不動
      </p>
      <p>有人喚她<br>像水滴在蠟上<br>她在蠟裏</p>
      <p>被蠟封住的湖<br>湖底輕輕晃動<br>而不動</p>
      <p>的果凍<br>她的被動</p>
      <p>
        在音箱裏<br>結成冰　<button
          type="button"
          data-speech="zoo"
          data-timeout="200"
        >
          /z/
        </button>
        <br>如果有人在她的胸脯或耳後<br>用力呵暖<br>她就會解凍<br>掉落
      </p>
      <p>
        像一枚松果<br>我們就聽到　　　　<button
          type="button"
          data-speech="goo"
          data-timeout="200"
        >
          /g/
        </button>
      </p>
      <p>先是被吹動的那層汗毛<br>有點縮緊<br>然後熱起來<br>腫脹<br>而彎曲</p>
      <p>而極想被打開被<br>穿透<br>那被動</p>
      <p>
        無限稠密而可以<br>收縮<br>用最少的呼吸<br>她說　<button
          type="button"
          data-speech="shh"
        >
          /ʃ/
        </button>
      </p>
      <p>不轉頭<br>亦不張望</p>
      <p>想降低<br>再繼續降低</p>
    </article>

    <script>
    const speech = window.speechSynthesis;

    if (speech) {
      document.querySelectorAll('button').forEach((b) => {
        b.addEventListener('click', () => {
          const u = new SpeechSynthesisUtterance(b.dataset.speech);
          u.lang = 'en-US';
          u.rate = 0.1;
          speech.cancel();
          speech.speak(u);
          if (b.dataset.timeout) {
            setTimeout(() => {
              speech.cancel();
            }, Number(b.dataset.timeout));
          }
        });
      });
    }
    </script>
  </body>
</html>
